version: '3.9'

services:
  # ─────────────────────────────────────────
  # PostgreSQL (fallback local dev / CI)
  # In production use NeonDB connection string
  # ─────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: aba_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aba_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aba_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aba_hrm}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - aba_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-aba_user} -d ${POSTGRES_DB:-aba_hrm}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Redis (sessions, queues, caching)
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aba_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-aba_redis_pass}
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    networks:
      - aba_network
    healthcheck:
      test: ['CMD', 'redis-cli', '--no-auth-warning', '-a', '${REDIS_PASSWORD:-aba_redis_pass}', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # Backend  (Node + Express + Prisma)
  # ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: aba_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql://aba_user:aba_secure_pass@postgres:5432/aba_hrm}
      REDIS_URL: ${REDIS_URL:-redis://:aba_redis_pass@redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      PORT: 3000
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/uploads:/app/uploads
    networks:
      - aba_network
    command: npm run dev

  # ─────────────────────────────────────────
  # Frontend  (Angular 15+ / Nginx in prod)
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: aba_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - '${FRONTEND_PORT:-4200}:4200'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - aba_network
    command: npm run start -- --host 0.0.0.0 --poll 1000

  # ─────────────────────────────────────────
  # Nginx reverse-proxy (prod only)
  # ─────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: aba_nginx
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - aba_network
    profiles:
      - production

  # ─────────────────────────────────────────
  # MailHog  (local email testing)
  # ─────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog:latest
    container_name: aba_mailhog
    restart: unless-stopped
    ports:
      - '1025:1025'   # SMTP
      - '8025:8025'   # Web UI
    networks:
      - aba_network
    profiles:
      - development

volumes:
  postgres_data:
  redis_data:

networks:
  aba_network:
    driver: bridge
